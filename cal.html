<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Calendar</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .calendar {
        background: white;
        padding: 20px;
        border-radius: 12px;
        width: 350px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .header button {
        background: #4facfe;
        border: none;
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    .header h2 {
        margin: 0;
    }

    .days, .dates {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        margin-top: 10px;
    }

    .days div {
        font-weight: bold;
        color: #555;
    }

    .dates div {
        position: relative;
        padding: 10px;
        margin: 3px;
        border-radius: 6px;
        cursor: pointer;
    }

    .dates div:hover {
        background: #e0f7ff;
    }

    .today {
        background: #4facfe;
        color: white;
    }

    .has-note::after {
        content: "";
        position: absolute;
        bottom: 3px;
        left: 50%;
        transform: translateX(-50%);
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #ff5252;
    }

    .note-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border-radius: 10px;
        display: none;
        box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        width: 260px;
    }

    .note-popup textarea {
        width: 100%;
        height: 80px;
        margin-top: 10px;
        box-sizing: border-box;
        font-family: inherit;
    }

    .note-popup .actions {
        display: flex;
        gap: 8px;
    }

    .note-popup button {
        margin-top: 10px;
        padding: 8px;
        border: none;
        background: #4facfe;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        flex: 1;
    }

    .note-popup button.delete {
        background: #ff5252;
    }

    .status {
        font-size: 12px;
        color: #888;
        margin-top: 6px;
        min-height: 14px;
    }
</style>
</head>
<body>

<div class="calendar">
    <div class="header">
        <button onclick="changeMonth(-1)">⬅️</button>
        <h2 id="monthYear"></h2>
        <button onclick="changeMonth(1)">➡️</button>
    </div>

    <div class="days">
        <div>Sun</div><div>Mon</div><div>Tue</div>
        <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>

    <div class="dates" id="dates"></div>
</div>

<div class="note-popup" id="popup">
    <h3 id="selectedDate"></h3>
    <textarea id="noteText" placeholder="Write your note..."></textarea>
    <div class="actions">
        <button onclick="saveNote()">Save</button>
        <button class="delete" onclick="deleteNote()">Delete</button>
    </div>
    <div class="status" id="status"></div>
</div>

<script>
// Point this at your backend if it's not served from the same origin as this page.
const API_BASE = "/api/notes";

let currentDate = new Date();
let selectedDateKey = "";
let notesCache = {}; // dateKey -> text, loaded from the DB for the visible month

async function fetchAllNotes() {
    try {
        const res = await fetch(API_BASE);
        if (!res.ok) throw new Error("Failed to load notes");
        notesCache = await res.json();
    } catch (err) {
        console.error(err);
        notesCache = {};
    }
}

async function renderCalendar() {
    const monthYear = document.getElementById("monthYear");
    const datesContainer = document.getElementById("dates");

    datesContainer.innerHTML = "";

    let year = currentDate.getFullYear();
    let month = currentDate.getMonth();

    let firstDay = new Date(year, month, 1).getDay();
    let lastDate = new Date(year, month + 1, 0).getDate();

    monthYear.innerText = currentDate.toLocaleString("default", {
        month: "long",
        year: "numeric"
    });

    await fetchAllNotes();

    for (let i = 0; i < firstDay; i++) {
        datesContainer.innerHTML += "<div></div>";
    }

    for (let i = 1; i <= lastDate; i++) {
        let dateDiv = document.createElement("div");
        dateDiv.innerText = i;

        let today = new Date();
        if (
            i === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {
            dateDiv.classList.add("today");
        }

        const key = `${year}-${month}-${i}`;
        if (notesCache[key] && notesCache[key].trim()) {
            dateDiv.classList.add("has-note");
        }

        dateDiv.onclick = () => openPopup(year, month, i);
        datesContainer.appendChild(dateDiv);
    }
}

function changeMonth(direction) {
    currentDate.setMonth(currentDate.getMonth() + direction);
    renderCalendar();
}

async function openPopup(year, month, day) {
    const popup = document.getElementById("popup");
    const noteText = document.getElementById("noteText");
    const status = document.getElementById("status");

    selectedDateKey = `${year}-${month}-${day}`;
    document.getElementById("selectedDate").innerText = `${day}/${month + 1}/${year}`;
    status.innerText = "Loading...";
    noteText.value = "";
    popup.style.display = "block";

    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(selectedDateKey)}`);
        const data = await res.json();
        noteText.value = data.text || "";
        status.innerText = "";
    } catch (err) {
        status.innerText = "Could not load note.";
    }
}

async function saveNote() {
    const noteText = document.getElementById("noteText").value;
    const status = document.getElementById("status");
    status.innerText = "Saving...";

    try {
        const res = await fetch(API_BASE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dateKey: selectedDateKey, text: noteText })
        });
        if (!res.ok) throw new Error("Save failed");
        document.getElementById("popup").style.display = "none";
        renderCalendar();
    } catch (err) {
        status.innerText = "Failed to save. Try again.";
    }
}

async function deleteNote() {
    const status = document.getElementById("status");
    status.innerText = "Deleting...";
    try {
        const res = await fetch(`${API_BASE}/${encodeURIComponent(selectedDateKey)}`, {
            method: "DELETE"
        });
        if (!res.ok) throw new Error("Delete failed");
        document.getElementById("popup").style.display = "none";
        renderCalendar();
    } catch (err) {
        status.innerText = "Failed to delete. Try again.";
    }
}

window.onclick = function(e) {
    const popup = document.getElementById("popup");
    if (e.target === popup) {
        popup.style.display = "none";
    }
};

renderCalendar();
</script>

</body>
</html>
