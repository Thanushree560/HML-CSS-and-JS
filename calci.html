<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    background-size: 300% 300%;
    animation: gradientMove 8s ease infinite;
    padding: 20px;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}


.calculator {
    width: 320px;
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 25px;
    padding: 15px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
}


.display {
    color: white;
    font-size: 40px;
    text-align: right;
    padding: 20px;
    min-height: 80px;
    word-wrap: break-word;
}


.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}


button {
    height: 65px;
    width: 65px;
    border-radius: 50%;
    border: none;
    font-size: 20px;
    background: #2c2c2c;
    color: white;
    cursor: pointer;
    transition: 0.2s;
}


button:active {
    transform: scale(0.9);
}


.special {
    background: #444;
}


.operator {
    background: #3a3a3a;
}

.equal {
    background: #ff8c1a;
    color: white;
    box-shadow: 0 0 10px #ff8c1a;
}

/* ---------- History panel ---------- */
.history-panel {
    width: 280px;
    max-height: 490px;
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 25px;
    padding: 15px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
    color: white;
    display: flex;
    flex-direction: column;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px 15px;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    margin-bottom: 10px;
}

.history-header h2 {
    font-size: 18px;
    font-weight: 500;
}

.history-header button {
    width: auto;
    height: auto;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    background: rgba(255,255,255,0.1);
}

.history-list {
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.history-item {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 10px 14px;
    cursor: pointer;
    position: relative;
}

.history-item:hover {
    background: rgba(255,255,255,0.12);
}

.history-expr {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
}

.history-result {
    font-size: 20px;
    font-weight: 500;
}

.history-empty {
    text-align: center;
    color: rgba(255,255,255,0.4);
    padding: 30px 10px;
    font-size: 14px;
}

.history-status {
    font-size: 11px;
    text-align: center;
    color: rgba(255,255,255,0.35);
    padding-top: 8px;
}
</style>
</head>

<body>

<div class="calculator">
    <div class="display" id="display">0</div>

    <div class="buttons">
        <button class="special" onclick="clearDisplay()">AC</button>
        <button class="special" onclick="append('%')">%</button>
        <button class="special" onclick="backspace()">⌫</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('00')">00</button>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<div class="history-panel">
    <div class="history-header">
        <h2>History</h2>
        <button onclick="clearHistory()">Clear all</button>
    </div>
    <div class="history-list" id="historyList">
        <div class="history-empty">No calculations yet</div>
    </div>
    <div class="history-status" id="historyStatus"></div>
</div>

<script>
let display = document.getElementById("display");
const historyList = document.getElementById("historyList");
const historyStatus = document.getElementById("historyStatus");

// Same-origin API base (server.js serves this file, so relative paths work)
const API_BASE = "/api/history";

function append(value) {
    if (display.innerText === "0" || display.innerText === "Error") {
        display.innerText = value;
    } else {
        display.innerText += value;
    }
}

function clearDisplay() {
    display.innerText = "0";
}

function backspace() {
    display.innerText = display.innerText.slice(0, -1);
    if (display.innerText === "") {
        display.innerText = "0";
    }
}

async function calculate() {
    const expression = display.innerText;
    try {
        const result = Function('"use strict"; return (' + expression + ')')();
        display.innerText = result;
        await saveToHistory(expression, result);
    } catch {
        display.innerText = "Error";
    }
}

// ---------- MongoDB-backed history ----------

async function saveToHistory(expression, result) {
    try {
        historyStatus.textContent = "Saving...";
        await fetch(API_BASE, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ expression, result })
        });
        historyStatus.textContent = "";
        await loadHistory();
    } catch (err) {
        historyStatus.textContent = "⚠ Could not reach database";
    }
}

async function loadHistory() {
    try {
        const res = await fetch(API_BASE);
        const entries = await res.json();
        renderHistory(entries);
    } catch (err) {
        historyStatus.textContent = "⚠ Could not reach database";
    }
}

function renderHistory(entries) {
    if (!entries || entries.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No calculations yet</div>';
        return;
    }
    historyList.innerHTML = entries.map(e => `
        <div class="history-item" onclick="reuseResult('${String(e.result).replace(/'/g, "\\'")}')">
            <div class="history-expr">${e.expression}</div>
            <div class="history-result">= ${e.result}</div>
        </div>
    `).join("");
}

function reuseResult(value) {
    display.innerText = value;
}

async function clearHistory() {
    try {
        await fetch(API_BASE, { method: "DELETE" });
        await loadHistory();
    } catch (err) {
        historyStatus.textContent = "⚠ Could not reach database";
    }
}

// Load history on page load
loadHistory();
</script>

</body>
</html>
